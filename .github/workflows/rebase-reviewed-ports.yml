name: Rebase reviewed Lean 4.36 ports
on:
  push:
    branches: [maintenance/rebase-reviewed-ports]
    paths:
      - tools/pr-rebase/**
      - .github/workflows/rebase-reviewed-ports.yml
permissions:
  contents: write
concurrency:
  group: rebase-reviewed-rh-ports
  cancel-in-progress: false
jobs:
  reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/pr-rebase
      - name: Resolve from the already-reviewed ports
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BATCH: reviewed
        run: python3 tools/pr-rebase/rebase_open_prs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-port-rebase-reports
          path: ${{ runner.temp }}/rh-rebase-*/results/
          if-no-files-found: warn
