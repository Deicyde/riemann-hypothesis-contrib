name: Replay the reviewed PR 54 resolutions from its original history
on:
  push:
    branches: [maintenance/rebase-54-clean-replay]
    paths:
      - tools/pr-rebase/**
      - .github/workflows/rebase-54-clean-replay.yml
permissions:
  contents: write
jobs:
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/pr-rebase
      - name: Replay explicit resolutions and refreshed heads
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BATCH: remaining
        run: python3 tools/pr-rebase/rebase_open_prs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-rebase-reports
          path: ${{ runner.temp }}/rh-rebase-*/results/
          if-no-files-found: warn
