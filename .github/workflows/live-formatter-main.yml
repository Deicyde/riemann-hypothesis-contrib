name: Follow current main for the formatter
on:
  push:
    branches: [maintenance/live-formatter-main]
    paths:
      - tools/pr-rebase/**
      - .github/workflows/live-formatter-main.yml
permissions:
  contents: write
jobs:
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/pr-rebase
      - name: Restack verified source trees over README changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BATCH: remaining
        run: python3 tools/pr-rebase/live_formatter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restack-rebase-reports
          path: ${{ runner.temp }}/rh-rebase-*/results/
          if-no-files-found: warn
