name: Restack verified candidates on current main
on:
  push:
    branches: [maintenance/restack-prepared-prs]
    paths:
      - tools/pr-rebase/**
      - .github/workflows/restack-prepared-prs.yml
permissions:
  contents: write
jobs:
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/pr-rebase
      - name: Replay explicit resolutions and refreshed heads
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BATCH: remaining
        run: python3 tools/pr-rebase/restack_prepared.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restack-rebase-reports
          path: ${{ runner.temp }}/rh-rebase-*/results/
          if-no-files-found: warn
