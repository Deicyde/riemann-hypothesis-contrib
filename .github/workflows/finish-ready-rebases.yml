name: Finalize eighteen proof and documentation rebases
on:
  push:
    branches: [maintenance/finish-ready-rebases]
    paths:
      - tools/pr-rebase/**
      - .github/workflows/finish-ready-rebases.yml
permissions:
  contents: write
jobs:
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/pr-rebase
      - name: Restack verified source trees over README changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BATCH: remaining
        run: python3 tools/pr-rebase/restack_trees.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restack-rebase-reports
          path: ${{ runner.temp }}/rh-rebase-*/results/
          if-no-files-found: warn
