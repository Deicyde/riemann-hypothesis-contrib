name: Rebase old PRs after cleanup merge
on:
  push:
    branches: [maintenance/rebase-after-cleanup-merge]
    paths:
      - tools/pr-rebase/**
      - .github/workflows/rebase-after-cleanup-merge.yml
permissions:
  contents: write
jobs:
  rebase:
    strategy:
      fail-fast: false
      matrix:
        batch: [owned, wide, proofs-a, proofs-b]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/pr-rebase
      - name: Rebase prepared feature commits on current main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BATCH: ${{ matrix.batch }}
        run: python3 tools/pr-rebase/rebase_prepared_current.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebase-after-cleanup-${{ matrix.batch }}
          path: ${{ runner.temp }}/rh-rebase-*/results/
          if-no-files-found: warn
