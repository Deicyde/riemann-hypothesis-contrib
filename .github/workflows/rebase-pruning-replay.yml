name: Replay old pruning ranges on the port
on:
  push:
    branches: [maintenance/rebase-pruning-replay]
    paths:
      - tools/pr-rebase/**
      - .github/workflows/rebase-pruning-replay.yml
permissions:
  contents: write
jobs:
  pruning:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/pr-rebase
      - name: Preserve ported declarations while replaying unambiguous deletions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BATCH: pruning-replay
        run: python3 tools/pr-rebase/rebase_open_prs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruning-replay-reports
          path: ${{ runner.temp }}/rh-rebase-*/results/
          if-no-files-found: warn
