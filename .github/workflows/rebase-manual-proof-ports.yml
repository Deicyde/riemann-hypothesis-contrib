name: Rebase manually resolved proof ports
on:
  push:
    branches: [maintenance/rebase-manual-proof-ports]
    paths:
      - tools/pr-rebase/**
      - .github/workflows/rebase-manual-proof-ports.yml
permissions:
  contents: write
jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/pr-rebase
      - name: Replay the reviewed manual resolutions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BATCH: manual
        run: python3 tools/pr-rebase/rebase_open_prs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-proof-port-reports
          path: ${{ runner.temp }}/rh-rebase-*/results/
          if-no-files-found: warn
